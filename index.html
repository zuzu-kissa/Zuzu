<body>


<header>

  <div class="menu-wrap">

    <button
      class="menu"
      type="button"
      aria-label="メニューを開く"

        <b></b>
        <b></b>
        <b></b>
      </i>

    </button>


    <nav
      class="menu-panel"
      aria-label="サイトメニュー"
    >

      <a href="index.html">

      </a>

      <a href="beans.html">

      </a>

      <a href="about.html">

      </a>

      <a href="contact.html">
        contact
      </a>

    </nav>

</header>



<main>


  <!-- HERO -->

  <section class="hero">


    <!-- BRAND -->

    <div class="brand">

      <span class="kissa">
        喫茶
      </span>

      <span class="mame">
        豆豆
      </span>

      <span class="zuzu">
        ~zu-zu~
      </span>

    </div>



    <!-- DARUMA -->

    <img
      class="mascot"
      src="assets/zuzu-daruma-approved.png"
      alt="豆豆だるま"
      draggable="false"
      role="button"
      tabindex="0"
      aria-label="豆豆だるまを転がす"
    >



    <!-- INTRO -->

    <p class="intro">

      手廻しロースターによる<br>

      自家焙煎コーヒー豆の通販です。

    <!-- LINE -->

    <!-- TAGLINE -->

      深煎りの中の甘さを。

  </section>



  <!-- LINKS -->

  <nav class="links">


    <a href="beans.html">

<footer>

  © 2026 zuzu coffee

</footer>



<script>

  /* =========================
     MENU
  ========================== */

  const menuWrap = document.querySelector(".menu-wrap");
  const menuButton = document.querySelector(".menu");

  menuButton.addEventListener("click", function () {

    const isOpen =
      menuWrap.classList.toggle("is-open");

    menuButton.setAttribute(
      "aria-expanded",
      isOpen
    );

  });


  document.addEventListener("click", function (event) {

    if (!menuWrap.contains(event.target)) {

      menuWrap.classList.remove("is-open");

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );

    }

  });



  /* =========================
     DARUMA
  ========================== */

  const mascot = document.querySelector(".mascot");

  function rollDaruma() {

    if (
      mascot.classList.contains("is-falling")
    ) {
      return;
    }

    mascot.classList.add("is-falling");

    mascot.addEventListener(
      "animationend",
      function () {

        mascot.classList.remove(
          "is-falling"
        );

      },
      {
        once:true
      }
    );

  }


  /* OPEN */

  window.addEventListener(
    "load",
    function () {

      setTimeout(
        rollDaruma,
        450
      );

    }
  );


  /* HOVER */

  mascot.addEventListener(
    "mouseenter",
    rollDaruma
  );


  /* CLICK / TAP */

  mascot.addEventListener(
    "click",
    rollDaruma
  );


  /* KEYBOARD */

  mascot.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {

        event.preventDefault();

        rollDaruma();

      }

    }
  );

</script>


</body>

</html>
