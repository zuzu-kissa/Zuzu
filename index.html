  <!-- DARUMA SCRIPT -->

  <script>

    document.addEventListener(
      'DOMContentLoaded',
      function(){

        const daruma =
          document.querySelector('.mascot');


        if(!daruma){
          return;
        }


        /*
          だるまを転がす
        */

        function rollDaruma(){

          /*
            動いている途中なら
            一度リセット
          */

          daruma.classList.remove(
            'is-falling'
          );


          /*
            アニメーションを
            最初から再生できるようにする
          */

          void daruma.offsetWidth;


          /*
            動かす
          */

          daruma.classList.add(
            'is-falling'
          );

        }



        /*
          ==================================
          サイトを開いた時

          0.7秒後に自動で1回転ぶ
          ==================================
        */

        setTimeout(
          function(){

            rollDaruma();

          },
          700
        );



        /*
          ==================================
          PC

          カーソルがだるまに入ったら転ぶ
          ==================================
        */

        daruma.addEventListener(
          'mouseenter',
          function(){

            /*
              アニメーション中は
              連続発火させない
            */

            if(
              !daruma.classList.contains(
                'is-falling'
              )
            ){

              rollDaruma();

            }

          }
        );



        /*
          ==================================
          スマホ

          タップしたら転ぶ
          ==================================
        */

        daruma.addEventListener(
          'click',
          function(){

            if(
              !daruma.classList.contains(
                'is-falling'
              )
            ){

              rollDaruma();

            }

          }
        );



        /*
          ==================================
          キーボード
          ==================================
        */

        daruma.addEventListener(
          'keydown',
          function(event){

            if(
              event.key === 'Enter' ||
              event.key === ' '
            ){

              event.preventDefault();

              rollDaruma();

            }

          }
        );



        /*
          ==================================
          動き終わったら
          次に備えてクラスを外す
          ==================================
        */

        daruma.addEventListener(
          'animationend',
          function(){

            daruma.classList.remove(
              'is-falling'
            );

          }
        );


      }
    );

  </script>


</body>
