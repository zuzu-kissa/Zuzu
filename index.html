  <!-- =========================
       DARUMA SCRIPT
  ========================== -->

  <script>

    const daruma =
      document.querySelector('.mascot');


    /*
      だるまを1回転がす関数
    */

    function rollDaruma(){

      if(!daruma){
        return;
      }


      /*
        すでに動いている場合でも
        最初から再生できるようにする
      */

      daruma.classList.remove(
        'is-falling'
      );


      /*
        ブラウザに一度状態を
        確定させる
      */

      void daruma.offsetWidth;


      /*
        アニメーション開始
      */

      daruma.classList.add(
        'is-falling'
      );

    }



    if(daruma){


      /* =====================================
         サイトを開いた最初に1回だけ転ぶ
      ===================================== */

      window.addEventListener(
        'load',
        function(){

          /*
            ページが表示されてから
            ほんの少し待って転ぶ
          */

          setTimeout(
            function(){

              rollDaruma();

            },
            550
          );

        }
      );


      /* =====================================
         PC
         カーソルが触れたら転ぶ
      ===================================== */

      if(
        window.matchMedia(
          '(hover: hover) and (pointer: fine)'
        ).matches
      ){

        daruma.addEventListener(
          'mouseenter',
          function(){

            rollDaruma();

          }
        );

      }


      /* =====================================
         スマホ・タブレット
         タップしたら転ぶ
      ===================================== */

      if(
        window.matchMedia(
          '(hover: none), (pointer: coarse)'
        ).matches
      ){

        daruma.addEventListener(
          'touchstart',
          function(){

            rollDaruma();

          },
          {
            passive:true
          }
        );

      }


      /* =====================================
         キーボード
      ===================================== */

      daruma.addEventListener(
        'keydown',
        function(event){

          if(
            event.key === 'Enter' ||
            event.key === ' '
          ){

            event.preventDefault();

            rollDaruma();

          }

        }
      );


      /* =====================================
         動き終わったら元に戻す
      ===================================== */

      daruma.addEventListener(
        'animationend',
        function(){

          daruma.classList.remove(
            'is-falling'
          );

        }
      );

    }

  </script>


</body>
