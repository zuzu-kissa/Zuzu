<body>

========================== -->

    <nav
      class="nav-menu"
      aria-label="メインメニュー"

      <a href="index.html">

      </a>

</header>



<main>


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">


    <!-- BRAND -->

    <div class="brand">

      <span class="kissa">

    <!-- DARUMA -->

    <img
      class="mascot"

      draggable="false"

<footer>

  © 2026 zuzu coffee

</footer>



<script>

  /* =========================
     MENU
  ========================== */

  const siteNav =
    document.querySelector(".site-nav");

  const navTrigger =
    document.querySelector(".nav-trigger");

  if (siteNav && navTrigger) {

    navTrigger.addEventListener(
      "click",
      function () {

        const opened =
          siteNav.classList.toggle("is-open");

        navTrigger.setAttribute(
          "aria-expanded",
          opened ? "true" : "false"
        );

      }
    );


    document.addEventListener(
      "click",
      function (event) {

        if (!siteNav.contains(event.target)) {

          siteNav.classList.remove("is-open");

          navTrigger.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      }
    );

  }



  /* =========================
     DARUMA
  ========================== */

  const mascot =
    document.querySelector(".mascot");


  function rollDaruma() {

    if (!mascot) {
      return;
    }


    /*
      連続動作でも必ず
      アニメーションを再スタートできるようにする
    */

    mascot.classList.remove("is-falling");

    void mascot.offsetWidth;

    mascot.classList.add("is-falling");

  }


  if (mascot) {

    /*
      ページ読込時。

      loadイベントを待つだけだと
      キャッシュ状況によって実行確認が
      分かりづらいためDOMContentLoaded後に実行。
    */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        setTimeout(
          rollDaruma,
          500
        );

      }
    );


    /* hover */

    mascot.addEventListener(
      "mouseenter",
      rollDaruma
    );


    /* click / tap */

    mascot.addEventListener(
      "click",
      rollDaruma
    );


    /* keyboard */

    mascot.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          rollDaruma();

        }

      }
    );

  }

</script>


</body>

</html>
