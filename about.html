<script>

  const menuWrap =
    document.querySelector(".menu-wrap");

  const menuButton =
    document.querySelector(".menu");


  menuButton.addEventListener(
    "click",
    function () {

      const isOpen =
        menuWrap.classList.toggle("is-open");

      menuButton.setAttribute(
        "aria-expanded",
        isOpen
      );

    }
  );


  document.addEventListener(
    "click",
    function (event) {

      if (!menuWrap.contains(event.target)) {

        menuWrap.classList.remove(
          "is-open"
        );

        menuButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }
  );

</script>
