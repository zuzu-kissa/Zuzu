<script>

  const siteNav =
    document.querySelector(".site-nav");

  const navTrigger =
    document.querySelector(".nav-trigger");


  navTrigger.addEventListener(
    "click",
    function () {

      const opened =
        siteNav.classList.toggle("is-open");

      navTrigger.setAttribute(
        "aria-expanded",
        opened ? "true" : "false"
      );

    }
  );


  document.addEventListener(
    "click",
    function (event) {

      if (!siteNav.contains(event.target)) {

        siteNav.classList.remove("is-open");

        navTrigger.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }
  );


  document.addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Escape") {

        siteNav.classList.remove("is-open");

        navTrigger.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }
  );

</script>
