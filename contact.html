  <meta charset="UTF-8">

  <meta

  <meta

    content="喫茶 豆豆へのお問い合わせ。"
  >

  <title>contact | 喫茶 豆豆 ~zu-zu~</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Noto+Serif+JP:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header>

  <details class="site-menu">

    <summary>

      <span class="menu-word">
        menu
      </span>

      <span class="hamburger">
        <i></i>
        <i></i>
        <i></i>
      </span>

    </summary>


    <nav class="menu-dropdown">

      <a href="index.html">
        home
      </a>

      <a href="beans.html">
        beans
      </a>

      <a href="about.html">
        about
      </a>

      <a href="contact.html">
        contact
      </a>

    </nav>

  </details>

</header>



<main class="compact-page">


  <section class="compact-hero">

    <a
      class="mini-brand"
      href="index.html"
    >
      喫茶 豆豆 ~zu-zu~
    </a>

    <h1>
      contact
    </h1>

    <span class="short-line"></span>

    <p>
      お問い合わせ。
    </p>

  </section>



  <section class="contact-compact">


    <p class="contact-intro">

      商品や豆豆についてのお問い合わせは、<br>

      Instagramまたはメールよりお願いいたします。

    </p>



    <a
      class="contact-row"
      href="https://www.instagram.com/"
      target="_blank"
      rel="noopener"
    >

      <img
        src="assets/icon-instagram.svg"
        alt=""
        width="34"
        height="34"
      >

      <span>
        instagram
      </span>

    </a>



    <a
      class="contact-row"
      href="mailto:hello@example.com"
    >

      <img
        src="assets/icon-contact.svg"
        alt=""
        width="34"
        height="34"
      >

      <span>
        mail
      </span>

    </a>


  </section>


</main>



<footer>

  © 2026 zuzu coffee

</footer>



<script>

  const menuWrap =
    document.querySelector(".menu-wrap");

  const menuButton =
    document.querySelector(".menu");


  menuButton.addEventListener(
    "click",
    function () {

      const isOpen =
        menuWrap.classList.toggle("is-open");

      menuButton.setAttribute(
        "aria-expanded",
        isOpen
      );

    }
  );


  document.addEventListener(
    "click",
    function (event) {

      if (!menuWrap.contains(event.target)) {

        menuWrap.classList.remove(
          "is-open"
        );

        menuButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }
  );

</script>


</body>

</html>
